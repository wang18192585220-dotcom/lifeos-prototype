const healthModules={sleep:{title:'睡眠',sub:'记录睡眠与醒来感受，找到适合自己的作息节奏。',button:'记录睡眠',empty:'还没有睡眠记录。从昨晚开始，记下你的第一晚睡眠。'},energy:{title:'精力',sub:'用一次简短记录，了解一天中的状态变化。',button:'记录当前状态',empty:'现在感觉怎么样？选择一个档位，留下今天的第一条状态记录。'},nutrition:{title:'营养',sub:'记录日常饮食与饮水，让饮食习惯更清晰。',button:'记录饮食',empty:'今天吃了什么？先用一句话记录一餐。'},medical:{title:'健康记录',sub:'把身体变化、就诊经历和检查资料放在一起，方便回看。',button:'新增健康记录',empty:'还没有健康记录。可以先添加一项身体指标或一次检查。'},recovery:{title:'恢复',sub:'给休息留出时间，记录哪些活动让自己感觉更好。',button:'记录恢复活动',empty:'还没有恢复活动记录。记下一次散步、拉伸或安静休息。'}};

let healthData=loadHealth();['sleep','energy','nutrition','water','medical','recovery','actions'].forEach(k=>healthData[k]=healthData[k]||[]);const saveHealth=()=>{localStorage.setItem('lifeosHealthRecords',JSON.stringify(healthData));syncState('lifeosHealthRecords',healthData)};
const dt=s=>s?new Date(s):new Date(),ymd=s=>dateKey(dt(s)),fmt=s=>`${dt(s).getMonth()+1} 月 ${dt(s).getDate()} 日 ${pad(dt(s).getHours())}:${pad(dt(s).getMinutes())}`,minDiff=(a,b)=>Math.max(0,Math.round((dt(b)-dt(a))/60000));
function healthHome(){const sleep=healthData.sleep.at(-1),energy=healthData.energy.at(-1),meals=healthData.nutrition.filter(r=>ymd(r.time)==='2026-09-11'),water=healthData.water.filter(r=>ymd(r.time)==='2026-09-11').reduce((s,r)=>s+(+r.amount||0),0),med=healthData.medical.at(-1),rec=healthData.recovery;const cards=[['sleep','睡眠',sleep?`${dateLabel(ymd(sleep.wake))} · ${sleep.duration} · 醒来感受${sleep.feel||'未记录'}`:'记录昨晚睡眠与醒来感受'],['energy','精力',energy?`${fmt(energy.time)} · 精力${energy.level}/5`:'记录此刻的精力状态'],['nutrition','营养',meals.length?`今日已记录 ${new Set(meals.map(x=>x.meal)).size} 餐 · 饮水 ${water} ml`:'记录今天的饮食与饮水'],['medical','健康记录',med?`最近记录：${dateLabel(ymd(med.date))} · ${med.title}`:'整理身体指标与健康资料'],['recovery','恢复',rec.length?`本周 ${rec.length} 次 · 累计 ${rec.reduce((s,r)=>s+(+r.minutes||0),0)} 分钟`:'记录休息与放松活动']];return `${pageHead('人生领域','健康管理','保护精力和恢复能力，支撑长期稳定输出。')}<div class="hint-line" style="margin-bottom:14px">记录保存在本浏览器 localStorage；示例数据不会与新增真实输入混合统计。</div><section class="section"><div class="section-head"><h2>健康管理</h2><span>尚未记录时显示入口提示</span></div><div class="grid g3">${cards.map(x=>`<article class="card clickable overview-card" data-health-page="${x[0]}"><div class="overview-icon">${icon('health')}</div><h3>${x[1]}</h3><p>${x[2]}</p><strong>进入页面</strong></article>`).join('')}</div></section>`}
function healthChrome(key,inner,side=''){const m=healthModules[key];return `<div class="health-breadcrumb"><button data-page="health" type="button">健康管理</button><span>/</span><span>${m.title}</span></div><header class="page-head"><div><div class="eyebrow">健康管理</div><h1>${m.title}</h1><p>${m.sub}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-health-action="goal" type="button">目标设置</button><button class="btn primary" data-health-new="${key}" type="button">${m.button}</button></div></header><div class="health-tabs">${healthKeys.map(k=>`<button class="health-tab ${k===key?'active':''}" data-health-page="${k}" type="button">${healthModules[k].title}</button>`).join('')}</div><div class="health-layout"><div>${inner}</div><aside>${side||healthSide(key)}</aside></div>`}

function bars(rows,val){return `<div class="chart">${rows.slice(-7).map(r=>`<div class="bar" style="height:${Math.max(12,Math.min(100,val(r)))}%"><span>${dt(r.time||r.wake||r.date||r.start).getDate()}</span></div>`).join('')||'<div class="empty" style="width:100%">趋势缺失日期留空，不自动补值。</div>'}</div>`}
function recordRows(key,rows){return rows.length?`<div class="card list-card">${rows.slice().reverse().map(r=>`<div class="row"><div class="row-main"><b>${healthTitle(key,r)}</b><small>${healthMeta(key,r)}</small></div><div class="row-actions"><button class="btn small" data-health-edit="${key}" data-id="${r.id}" type="button">编辑</button><button class="btn small" data-health-delete="${key}" data-id="${r.id}" type="button">删除</button></div></div>`).join('')}</div>`:`<div class="empty">${healthModules[key].empty}<br><button class="btn primary" data-health-new="${key}" style="margin-top:10px" type="button">新增记录</button></div>`}
function healthTitle(k,r){if(k==='sleep')return `${dateLabel(ymd(r.wake))} · ${r.type}`;if(k==='energy')return `精力 ${r.level}/5 · ${r.mood||'未填情绪'}`;if(k==='nutrition')return `${r.meal} · ${r.food}`;if(k==='medical')return `${r.type} · ${r.title}`;return `${r.name} · ${r.minutes} 分钟`}

function healthSide(key){return `<div class="card"><h3>我的目标</h3><p>${key==='sleep'?'23:30 入睡 · 07:30 起床 · 7.5 小时':key==='nutrition'?'今日饮水目标 1,500 ml':key==='energy'?'每天记录 2 次状态':key==='medical'?'整理检查资料并按需跟进':'每周安排 3 次恢复活动'}</p><button class="btn small" data-health-action="goal" type="button">调整目标</button></div><div class="card" style="margin-top:12px"><h3>下一步行动</h3><p>${key==='sleep'?'今晚 23:30 开始睡前准备':key==='energy'?'下午安排 10 分钟休息':key==='nutrition'?'准备明天的午餐':key==='medical'?'整理检查资料':'给自己安排一次休息'}</p><button class="btn small" data-health-action="task" type="button">安排到日历</button></div>`}
function sleepPage(){const rows=healthData.sleep,avg=rows.length?`${Math.round(rows.reduce((s,r)=>s+r.minutes,0)/rows.length/60*10)/10} 小时`:'暂无记录',last=rows.at(-1);return healthChrome('sleep',`${kpis([['最近一晚',last?last.duration:'暂无记录','按醒来日期归属'],['近 7 天平均',avg,`样本 ${rows.length} 晚`],['近 7 天已记录',`${rows.length}/7 晚`,'示例区间']])}<section class="section"><div class="section-head"><h2>最近一晚</h2><span>夜间睡眠与午睡分开统计</span></div>${last?`<div class="card"><h3>${healthTitle('sleep',last)}</h3><p>${healthMeta('sleep',last)}</p></div>`:'<div class="empty">暂无记录</div>'}</section><section class="section"><div class="section-head"><h2>睡眠趋势</h2><span>近 7 天</span></div>${bars(rows,r=>r.minutes/6)}</section><section class="section"><div class="section-head"><h2>历史记录</h2><span>支持编辑与删除</span></div>${recordRows('sleep',rows)}</section>`)}
function energyPage(){const rows=healthData.energy,last=rows.at(-1),avg=rows.length?(rows.reduce((s,r)=>s+(+r.level||0),0)/rows.length).toFixed(1):'暂无';return healthChrome('energy',`${kpis([['最近状态',last?`${last.level}/5`:'暂无记录',last?fmt(last.time):''],['今日记录',`${rows.filter(r=>ymd(r.time)==='2026-09-11').length} 次`,'不推断未记录时段'],['近 7 天记录',`${new Set(rows.map(r=>ymd(r.time))).size} 天`,'示例区间']])}<section class="section"><div class="section-head"><h2>快速记录</h2><span>选择后仍需保存</span></div><div class="card pillrow">${[1,2,3,4,5].map(n=>`<button class="quick-pill" data-energy-level="${n}" type="button">${n} · ${['很低','偏低','一般','较充沛','很充沛'][n-1]}</button>`).join('')}</div></section><section class="section"><div class="section-head"><h2>今日变化</h2><span>每日平均 ${avg}</span></div>${bars(rows,r=>r.level*20)}</section><section class="section"><div class="section-head"><h2>状态笔记</h2><span>时间、精力、情绪、标签</span></div>${recordRows('energy',rows)}</section>`)}

/* ========== 后端持久化同步（demo → 后端 /state/:key） ========== */
// 从后端读取整块状态；未启动/无数据返回 null（前端以 localStorage/默认数据兜底）。
async function backendState(key){
  try{
    const r = await fetch(API_BASE + '/state/' + encodeURIComponent(key));
    if(!r.ok) return null;
    const j = await r.json();
    return (j && j.data != null) ? j.data : null;
  }catch(e){ return null; }
}
// 把整块状态写回后端（静默失败，localStorage 仍是本地兜底）。
function syncState(key, value){
  try{
    fetch(API_BASE + '/state/' + encodeURIComponent(key), {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(value)
    }).catch(()=>{});
  }catch(e){}
}

  return null;
}

function agentTabTitle(){

function agentTabBody(){

function getSavedKnowledgeLibraries(){
  try{return JSON.parse(localStorage.getItem('lifeosKnowledgeLibraries')||'[]')}catch(e){return []}
}
function getKnowledgeLibraries(){
  const saved=getSavedKnowledgeLibraries().filter(x=>x.source!=='folder');
  const agentLibraries=getAllAgents().map((a,index)=>({id:a.knowledgeId,name:a.name+(index===0?' 知识库':''),creator:'Shiyu Wang',manager:'Shiyu Wang',type:'Agent 知识库',updatedAt:index===0?'刚刚':`${index+1} 天前`,source:'agent',agentId:a.id}));
  return [...agentLibraries,...saved];
}
function currentKnowledgeLibrary(){const libraries=getKnowledgeLibraries();return libraries.find(x=>x.id===window.selectedKnowledgeLibraryId)||libraries.find(x=>x.id===getCurrentAgent().knowledgeId)||libraries[0]}
function activeKnowledgeId(){return window.selectedKnowledgeLibraryId||getCurrentAgent().knowledgeId}
function saveKnowledgeLibrary(item){
  let saved=[];try{saved=JSON.parse(localStorage.getItem('lifeosKnowledgeLibraries')||'[]')}catch(e){}
  saved.push(item);localStorage.setItem('lifeosKnowledgeLibraries',JSON.stringify(saved));
}

/* ========== Agent 配置交互（绑定在设置页打开后） ========== */
function initAISettingsEvents(){
  // 绑定 Tab 切换
  document.querySelectorAll('[data-agent-tab]').forEach(btn=>{
    btn.onclick=async()=>{ agentTab=btn.dataset.agentTab; rerenderAgentSettings(); };
  });
  // 模型保存
  const saveBtn=document.getElementById('agSaveBtn');
  if(saveBtn) saveBtn.onclick=async()=>{
    const payload={
      provider:document.getElementById('agProvider').value,
      apiKey:document.getElementById('agApiKey').value.trim(),
      model:document.getElementById('agModel').value.trim(),
      baseUrl:document.getElementById('agBaseUrl').value.trim(),
      temperature:parseFloat(document.getElementById('agTemperature').value||'0.3'),
      knowledgeEnabled:document.getElementById('agKbEnabled')?.checked ?? true,
      knowledgeInternalData:document.getElementById('agKbInternal')?.checked ?? true,
      knowledgeMaxChunks:parseInt(document.getElementById('agKbMax')?.value||'5',10)
    };
    const msg=document.getElementById('agTestMsg'); if(msg) msg.textContent='保存中...';
    try{
      const r=await fetch(API_BASE+'/agent-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!r.ok) throw new Error(await r.text());
      agentCfg=await r.json();
      if(msg) msg.textContent='已保存 ✓';
      showToast('Agent 配置已保存');
      // 刷新 AI 欢迎屏
      if(messagesEl().children.length===0 || messagesEl().querySelector('.bubble')?.textContent?.includes('API Key')){
        messagesEl().innerHTML=''; showWelcomeIfEmpty();
      }
      rerenderAgentSettings();
    }catch(e){ if(msg) msg.textContent='保存失败: '+e.message; }
  };
  const testBtn=document.getElementById('agTestBtn');
  if(testBtn) testBtn.onclick=async()=>{
    const msg=document.getElementById('agTestMsg'); msg.textContent='测试中...';
    try{
      const r=await fetch(API_BASE+'/agent-config/test',{method:'POST'});
      const d=await r.json();
      if(d.ok) msg.textContent='连接成功 ✓ 模型返回: '+ (d.preview||'').slice(0,50);
      else msg.textContent='失败: '+d.error;
    }catch(e){ msg.textContent='失败: '+e.message; }
  };
  // 知识库：自定义 toggle 开关
  document.querySelectorAll('.agent-toggle[data-toggle-target]').forEach(btn=>{
    btn.onclick=()=>{
      const cb=document.getElementById(btn.dataset.toggleTarget);
      if(!cb)return;
      cb.checked=!cb.checked;
      btn.classList.toggle('on',cb.checked);
    };
  });
  // 知识库管理与导入
  document.querySelectorAll('[data-kb-filter]').forEach(btn=>btn.onclick=()=>{knowledgeFilter=btn.dataset.kbFilter;rerenderAgentSettings()});
  document.querySelectorAll('[data-kb-open]').forEach(row=>row.onclick=e=>{if(e.target.closest('.kb-more')){showToast('更多管理功能即将开放');return}window.selectedKnowledgeLibraryId=row.dataset.kbOpen;const lib=currentKnowledgeLibrary();if(lib.agentId&&activeAgentId!==lib.agentId)switchAgent(lib.agentId);knowledgeView='detail';rerenderAgentSettings()});
  const backBtn=document.querySelector('[data-kb-back]');if(backBtn)backBtn.onclick=()=>{knowledgeView='list';rerenderAgentSettings()};
  document.querySelectorAll('[data-kb-create]').forEach(btn=>btn.onclick=()=>document.getElementById('kbCreateModal')?.classList.add('show'));
  document.querySelectorAll('[data-kb-import]').forEach(btn=>btn.onclick=()=>{const lib=currentKnowledgeLibrary();knowledgeImportFiles=[];knowledgeImportRootId=lib.id;knowledgeImportSelectedFolderId='';const dirs=document.getElementById('kbImportDirectories');if(dirs)dirs.innerHTML=knowledgeImportDirectoryHtml(lib);bindKnowledgeImportDirectories(lib);const selected=document.getElementById('kbSelectedFiles');if(selected)selected.innerHTML='';const summary=document.getElementById('kbImportSummary');if(summary)summary.textContent='尚未选择知识';document.getElementById('kbImportModal')?.classList.add('show')});
  document.querySelectorAll('[data-kb-modal-close]').forEach(btn=>btn.onclick=()=>btn.closest('.kb-modal-mask')?.classList.remove('show'));
  const createConfirm=document.getElementById('kbCreateConfirm');if(createConfirm)createConfirm.onclick=()=>{const name=document.getElementById('kbCreateName').value.trim();if(!name){showToast('请输入知识库名称');return}const id='kb-custom-'+Date.now();saveKnowledgeLibrary({id,name,description:document.getElementById('kbCreateDesc').value.trim(),creator:'Shiyu Wang',manager:'Shiyu Wang',type:'文件夹',updatedAt:'刚刚',source:'custom'});window.selectedKnowledgeLibraryId=id;knowledgeView='detail';rerenderAgentSettings();showToast('知识库已创建')};
  const renderSelectedFiles=()=>{const box=document.getElementById('kbSelectedFiles'),summary=document.getElementById('kbImportSummary');if(box)box.innerHTML=knowledgeImportFiles.map(f=>`<span class="kb-file-chip">${escapeHtml(f.webkitRelativePath||f.name)}</span>`).join('');if(summary)summary.textContent=knowledgeImportFiles.length?`已选择 ${knowledgeImportFiles.length} 个文件`:'尚未选择知识'};
  const acceptFiles=files=>{const allowed=/\.(pdf|txt|md|doc|docx|json|csv)$/i;knowledgeImportFiles=[...knowledgeImportFiles,...Array.from(files).filter(f=>allowed.test(f.name))].slice(0,100);renderSelectedFiles()};
  const fileInput=document.getElementById('agKbFile');if(fileInput)fileInput.onchange=()=>acceptFiles(fileInput.files);
  const folderInput=document.getElementById('kbFolderInput');if(folderInput)folderInput.onchange=()=>acceptFiles(folderInput.files);
  document.querySelectorAll('.kb-drop-zone').forEach(zone=>{zone.ondragover=e=>{e.preventDefault();zone.classList.add('dragover')};zone.ondragleave=()=>zone.classList.remove('dragover');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('dragover');acceptFiles(e.dataTransfer.files)}});
  // 知识库：批量上传
  const upBtn=document.getElementById('agKbUploadBtn');
  if(upBtn) upBtn.onclick=async()=>{
    if(!knowledgeImportFiles.length){showToast('请先选择文件');return}
    upBtn.disabled=true;upBtn.textContent='正在导入...';let success=0;
    try{
      for(const f of knowledgeImportFiles){const fd=new FormData();fd.append('file',f);fd.append('knowledgeId',knowledgeImportRootId);fd.append('folderId',knowledgeImportSelectedFolderId);fd.append('relativePath',f.webkitRelativePath||f.name);const r=await fetch(API_BASE+'/knowledge/upload',{method:'POST',body:fd});const d=await r.json();if(d.error)throw new Error(d.error);success++}
      showToast(`成功导入 ${success} 个文件`);
      knowledgeImportFiles=[];document.getElementById('kbImportModal')?.classList.remove('show');if(knowledgeView==='detail')await refreshKbLists();else await refreshKnowledgeCounts();
    }catch(e){showToast('导入失败: '+e.message)}finally{upBtn.disabled=false;upBtn.textContent='开始导入'}
  };
  const addEntry=document.getElementById('agEntryAddBtn');
  if(addEntry) addEntry.onclick=async()=>{
    const title=document.getElementById('agEntryTitle').value.trim();
    const content=document.getElementById('agEntryContent').value.trim();
    const tags=document.getElementById('agEntryTags').value.trim();
    if(!title||!content){ showToast('标题和内容必填'); return; }
    try{
      await fetch(API_BASE+'/knowledge/entry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,content,tags,knowledgeId:activeKnowledgeId()})});
      document.getElementById('agEntryTitle').value='';
      document.getElementById('agEntryContent').value='';
      document.getElementById('agEntryTags').value='';
      showToast('已添加条目');
      await refreshKbLists();
    }catch(e){ showToast('添加失败: '+e.message); }
  };
  // 技能：绑定事件
  bindSkillEvents();
  // 工作流：创建
  const wfBtn=document.getElementById('agWfCreateBtn');
  if(wfBtn) wfBtn.onclick=async()=>{
    const name=document.getElementById('agWfName').value.trim();
    const cron=document.getElementById('agWfCron').value.trim();
    const prompt=document.getElementById('agWfPrompt').value.trim();
    if(!name||!cron||!prompt){ showToast('请填写完整'); return; }
    try{
      await fetch(API_BASE+'/workflows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,triggerType:'cron',triggerConfig:{cron},actionType:'ai_message',actionConfig:{prompt}})});
      document.getElementById('agWfName').value='';
      document.getElementById('agWfCron').value='';
      document.getElementById('agWfPrompt').value='';
      showToast('工作流已创建');
      await refreshWfList();
    }catch(e){ showToast('创建失败: '+e.message); }
  };
  // 初始拉取列表
  if(settingsView==='agent-knowledge'){
    if(knowledgeView==='detail')refreshKbLists();
    else refreshKnowledgeCounts();
  }
  refreshSkillsList();
  refreshWfList();
}

async function rerenderAgentSettings(){
  await loadAgentCfg();
  const panel=document.querySelector('.settings-panel');
  if(panel){
    const head=settingsView==='agent-knowledge'?'':`<header class="settings-panel-head"><h1>${agentTabTitle()}</h1><p>${{model:'配置模型、权限和 Agent 基础行为。',knowledge:'管理 Agent 可检索的文档和长期记忆。',skills:'控制 Agent 可调用的工具能力。',workflows:'配置自动化触发器和提醒。'}[agentTab]}</p></header>`;
    panel.innerHTML=head+settingsPanelHtml();
  }
  initAISettingsEvents();
}

async function refreshKnowledgeCounts(){
  const countEls=Array.from(document.querySelectorAll('[data-kb-count]'));
  await Promise.all(countEls.map(async el=>{
    try{
      const knowledgeId=encodeURIComponent(el.dataset.kbCount);
      const [docsRes,entriesRes]=await Promise.all([
        fetch(API_BASE+'/knowledge/documents?knowledgeId='+knowledgeId).then(r=>r.json()),
        fetch(API_BASE+'/knowledge/entries?knowledgeId='+knowledgeId).then(r=>r.json())
      ]);
      const docs=docsRes.documents||docsRes||[];
      const entries=entriesRes.entries||entriesRes||[];
      el.textContent=String(docs.length+entries.length);
    }catch(e){el.textContent='0'}
  }));
}

async function refreshKbLists(){
  try{
    const knowledgeId=encodeURIComponent(activeKnowledgeId());
    const [docsRes,entriesRes]=await Promise.all([
      fetch(API_BASE+'/knowledge/documents?knowledgeId='+knowledgeId).then(r=>r.json()),
      fetch(API_BASE+'/knowledge/entries?knowledgeId='+knowledgeId).then(r=>r.json())
    ]);
    const docs = docsRes.documents || docsRes || [];
    const entries = entriesRes.entries || entriesRes || [];
    const docsEl=document.getElementById('agKbDocs');
    if(docsEl){
      docsEl.innerHTML=docs.length?docs.map(d=>`<div class="kb-row"><div class="kb-row-ic">📄</div><div class="kb-row-main"><div class="kb-row-title">${escapeHtml(d.name)}</div><div class="kb-row-meta">${(d.size/1024).toFixed(1)}KB · ${d.chunks} 片段 · ${d.status||'ready'} · ${new Date(d.createdAt).toLocaleString()}</div></div><button class="kb-row-del" data-kb-del-doc="${d.id}" type="button">删除</button></div>`).join(''):'<div class="kb-empty">还没有文档，上传一份试试 📎</div>';
    }
    const entEl=document.getElementById('agKbEntries');
    if(entEl){
      entEl.innerHTML=entries.length?entries.map(e=>`<div class="kb-row"><div class="kb-row-ic">✍️</div><div class="kb-row-main"><div class="kb-row-title">${escapeHtml(e.title)}${e.tags?' <span style="color:var(--muted);font-weight:400">· '+escapeHtml(e.tags)+'</span>':''}</div><div class="kb-row-meta">${escapeHtml((e.content||'').slice(0,80))}${(e.content||'').length>80?'...':''}</div></div><button class="kb-row-del" data-kb-del-entry="${e.id}" type="button">删除</button></div>`).join(''):'<div class="kb-empty">还没有手动条目，添加一条让 Agent 记住你 ✍️</div>';
    }
    // 绑定删除
    document.querySelectorAll('[data-kb-del-doc]').forEach(b=>b.onclick=async()=>{
      if(!confirm('删除该文档？'))return;
      await fetch(API_BASE+'/knowledge/documents/'+b.dataset.kbDelDoc+'?knowledgeId='+knowledgeId,{method:'DELETE'});
      await refreshKbLists(); showToast('已删除');
    });
    document.querySelectorAll('[data-kb-del-entry]').forEach(b=>b.onclick=async()=>{
      if(!confirm('删除该条目？'))return;
      await fetch(API_BASE+'/knowledge/entries/'+b.dataset.kbDelEntry+'?knowledgeId='+knowledgeId,{method:'DELETE'});
      await refreshKbLists(); showToast('已删除');
    });
  }catch(e){ /* ignore */ }
}

async function refreshSkillsList(){
  try{
    const data=await fetch(API_BASE+'/skills').then(r=>r.json());
    const skills = data.skills || data || [];
    const el=document.getElementById('agSkillsList');
    if(!el) return;
    el.innerHTML=skills.map(s=>`<div class="agent-item"><div class="item-icon">${s.icon||'🧩'}</div><div class="item-main"><b>${escapeHtml(s.displayName)} ${s.builtin?'<small style="color:var(--blue);display:inline">内置</small>':''}</b><small>${escapeHtml(s.description||'')}</small></div><button class="agent-toggle ${s.enabled?'on':''}" data-skill-toggle="${s.id}" type="button"><i></i></button></div>`).join('') || '<small class="agent-hint" style="padding:10px;display:block">暂无技能</small>';
    bindSkillEvents();
  }catch(e){ /* ignore */ }
}

function bindSkillEvents(){
  document.querySelectorAll('[data-skill-toggle]').forEach(b=>{
    b.onclick=async()=>{
      const isOn=b.classList.contains('on');
      await fetch(API_BASE+'/skills/'+b.dataset.skillToggle+'/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!isOn})});
      await refreshSkillsList();
      showToast(isOn?'技能已关闭':'技能已启用');
    };
  });
}

async function refreshWfList(){
  try{
    const wfRes=await fetch(API_BASE+'/workflows').then(r=>r.json());
    const wfs = wfRes.workflows || wfRes || [];
    const el=document.getElementById('agWfList');
    if(!el) return;
    el.innerHTML=wfs.length?wfs.map(w=>`<div class="agent-item"><div class="item-icon">⏰</div><div class="item-main"><b>${escapeHtml(w.name)} <span class="kbd">${escapeHtml(w.triggerConfig?.cron||'')}</span></b><small>${escapeHtml((w.actionConfig?.prompt||'').slice(0,80))}</small><small style="color:${w.enabled?'#15803d':'#888'}">${w.enabled?'启用中':'已停用'} · 上次运行：${w.lastRunAt?new Date(w.lastRunAt).toLocaleString():'未运行'}</small></div><button class="btn small" data-wf-run="${w.id}" type="button">测试</button><button class="btn small danger" data-wf-del="${w.id}" type="button">删除</button></div>`).join(''):'<small class="agent-hint" style="padding:10px;display:block">还没有工作流</small>';
    document.querySelectorAll('[data-wf-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm('删除该工作流？'))return;
      await fetch(API_BASE+'/workflows/'+b.dataset.wfDel,{method:'DELETE'});
      await refreshWfList(); showToast('已删除');
    });
    document.querySelectorAll('[data-wf-run]').forEach(b=>b.onclick=async()=>{
      b.disabled=true; b.textContent='执行中...';
      const r=await fetch(API_BASE+'/workflows/'+b.dataset.wfRun+'/run',{method:'POST'}).then(r=>r.json()).catch(e=>({error:e.message}));
      b.disabled=false; b.textContent='测试';
      showToast(r.error?'失败: '+r.error:'执行完成: '+(r.result||'').slice(0,40));
      await refreshWfList();
    });
  }catch(e){ /* ignore */ }
}

let prevBeforeSettings='today';

// 生成 LifeOS 内部数据快照（发给后端注入到 system prompt）
function buildInternalDataSnapshot() {
  const data = dataStore.get();
  const todayKey = new Date().toISOString().slice(0, 10);
  const todayTasksAll = data.tasks.filter(t => t.today);
  const todayDone = todayTasksAll.filter(t => t.status === 'done').length;
  const activeProjects = data.projects.filter(p => p.status && !['已完成', '已暂停'].includes(p.status));
  const pendingTasks = data.tasks.filter(t => t.status !== 'done');
  const blocked = pendingTasks.filter(t => t.priority === '高').slice(0, 5);
  const lastSleep = healthData.sleep.at(-1);
  const lastEnergy = healthData.energy.at(-1);
  const memText = memories.slice(0, 5).map(m => `- [${m[0]}] ${m[1]}（${m[2]}）`).join('\n');
  const currentPageTitle = titleFor(current);

  return `## 当前 LifeOS 数据快照
- 当前页面：${currentPageTitle}
- 今天日期：${todayKey}
- 今日任务：${todayTasksAll.length} 个，已完成 ${todayDone} 个
${todayTasksAll.map(t => `  • [${t.status}] ${t.name}（${t.duration}，${t.priority}优先级，项目：${(data.projects.find(p=>p.id===t.projectId)||{}).name||'未关联'}）`).join('\n')}
- 进行中项目：${activeProjects.length} 个
${activeProjects.map(p => `  • ${p.name}（${p.progress}%，${p.status}，截止 ${p.deadline||'未设'}）`).join('\n')}
- 高优先级待处理：${blocked.length} 个
${blocked.map(t => `  • ${t.name}（${(data.projects.find(p=>p.id===t.projectId)||{}).name||''}）`).join('\n')}
- 健康数据：${lastSleep ? `最近睡眠 ${lastSleep.duration}` : '无睡眠记录'}；${lastEnergy ? `最近精力 ${lastEnergy.level}/5` : '无精力记录'}

## 用户偏好（从个人记忆提取）
${memText}

- 你可以调用本地工具来查询和修改系统数据：创建任务/项目、更新项目详情、标记完成、查询状态、导航页面等可直接执行。

- 时间相关默认以今天（${todayKey}）为基准，回答用中文。`;

// Helper: find project fuzzy
function findProject(query) {
  if (!query) return null;
  const data = dataStore.get();
  const q = String(query).trim().toLowerCase();
  if (!q) return null;
  return data.projects.find(p => p.id === query) ||
    data.projects.find(p => p.name.toLowerCase() === q) ||
    data.projects.find(p => p.name.toLowerCase().includes(q) || q.includes(p.name.toLowerCase())) ||
    null;
}

      scope: { type: 'string', enum: ['today', 'project', 'all_tasks', 'health_summary', 'projects_overview'], description: '查询范围' },
      project_query: { type: 'string', description: '项目名称关键词（scope=project时必填）' }
    },
    required: ['scope']
  },
  requiresConfirmation: false,
  execute(args) {
    const data = dataStore.get();
    const todayKey = new Date().toISOString().slice(0, 10);
    if (args.scope === 'today') {
      const todayT = data.tasks.filter(t => t.today && t.status !== 'done');
      return { summary: `今日待完成 ${todayT.length} 个任务`, items: todayT.map(t => ({ name: t.name, project: (data.projects.find(p=>p.id===t.projectId)||{}).name, duration: t.duration, priority: t.priority })) };
    }
    if (args.scope === 'project') {
      const p = findProject(args.project_query);
      if (!p) return { error: '未找到该项目' };
      const tasks = data.tasks.filter(t => t.projectId === p.id);
      const milestones = data.milestones.filter(m => m.projectId === p.id);
      const done = tasks.filter(t => t.status === 'done').length;
      return { project: { name: p.name, progress: p.progress, status: p.status, deadline: p.deadline, description: p.description }, tasks_total: tasks.length, tasks_done: done, milestones: milestones.map(m => ({ name: m.name, status: m.status })) };
    }
    if (args.scope === 'projects_overview') {
      return { projects: data.projects.filter(p=>p.status&&!['已完成','已暂停'].includes(p.status)).map(p => ({ name: p.name, area: p.area, progress: p.progress, status: p.status, deadline: p.deadline })) };
    }
    if (args.scope === 'health_summary') {
      return { last_sleep: healthData.sleep.at(-1) ? { duration: healthData.sleep.at(-1).duration, feel: healthData.sleep.at(-1).feel } : null, last_energy: healthData.energy.at(-1)?{level:healthData.energy.at(-1).level}:null, recent_recovery: healthData.recovery.length, water_today: healthData.water.filter(r=>ymd(r.time)==='2026-09-11').reduce((s,r)=>s+(+r.amount||0),0) };
    }
    if (args.scope === 'all_tasks') {
      return { pending: data.tasks.filter(t => t.status !== 'done').map(t => ({ name: t.name, project: (data.projects.find(p=>p.id===t.projectId)||{}).name, priority: t.priority, status: t.status })) };
    }
    return { error: '未知查询范围' };
  }
});

  },

    properties: {

      create_if_missing: { type: 'boolean', description: '找不到项目时是否创建，默认 true' },
      area: { type: 'string', enum: ['career', 'learning', 'health', 'exercise', 'finance', 'network'], description: '创建项目时的所属领域，默认 career' },
      status: { type: 'string', description: '项目状态，例如 验证通过、进行中、规划中' },
      progress: { type: 'number', description: '项目进度 0-100' },
      deadline: { type: 'string', description: '截止日期 YYYY-MM-DD' },
      description: { type: 'string', description: '项目说明' },
      summary: { type: 'string', description: '项目一句话总结或定位' },
      validation: { type: 'string', description: '验证结论，例如“手工副业已验证可行”' },
      focus: { type: 'array', items: { type: 'string' }, description: '当前重点列表' },
      success_criteria: { type: 'array', items: { type: 'string' }, description: '成功标准列表' },
      next_actions: { type: 'array', items: { type: 'string' }, description: '下一步行动列表' },
      risks: { type: 'array', items: { type: 'string' }, description: '风险或卡点列表' },
      resources: { type: 'array', items: { type: 'string' }, description: '资源、素材、链接或参考资料列表' },
      notes: { type: 'array', items: { type: 'string' }, description: '需要沉淀到项目详情的讨论结论' },
      milestones: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, criteria: { type: 'string' }, status: { type: 'string' } } }, description: '要写入的里程碑' },
      tasks: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, next_action: { type: 'string' }, priority: { type: 'string' }, duration: { type: 'string' }, workstream: { type: 'string' }, today: { type: 'boolean' } } }, description: '要创建的任务' }
    },
    required: ['project_query']
  },
  requiresConfirmation: false,
  execute(args) {
    const data = dataStore.get();
    const q = String(args.project_query || '').trim().toLowerCase();
    let project = data.projects.find(p => p.id === args.project_query) ||
      data.projects.find(p => p.name.toLowerCase() === q) ||
      data.projects.find(p => p.name.toLowerCase().includes(q) || q.includes(p.name.toLowerCase()));
    const created = !project;
    if (!project && args.create_if_missing !== false) {
      project = {
        id: `p-${Date.now()}`,
        name: args.project_query,
        area: args.area || 'career',
        goal: areaMeta[args.area || 'career']?.goal || '',
        progress: 0,
        status: '规划中',
        deadline: args.deadline || '',
        description: args.description || `${args.project_query}项目`,
        details: {}
      };
      data.projects.push(project);
    }
    if (!project) return { error: '未找到该项目，请先创建项目或提供更准确的项目名称' };

    if (args.status) project.status = args.status;
    if (typeof args.progress === 'number') project.progress = Math.max(0, Math.min(100, Math.round(args.progress)));
    if (args.deadline) project.deadline = args.deadline;
    if (args.description) project.description = args.description;
    project.details = project.details || {};
    const map = { success_criteria: 'successCriteria', next_actions: 'nextActions' };
    ['summary','validation','focus','risks','resources','notes'].forEach(k => { if (args[k] !== undefined) project.details[k] = args[k]; });
    Object.entries(map).forEach(([from,to]) => { if (args[from] !== undefined) project.details[to] = args[from]; });

    const now = Date.now();
    const newMilestones = Array.isArray(args.milestones) ? args.milestones.filter(m => m && m.name).map((m, i) => ({
      id: `m-${now}-${i}`,
      projectId: project.id,
      stageId: '',
      name: m.name,
      status: m.status || (i === 0 ? 'current' : 'pending'),
      criteria: m.criteria || ''
    })) : [];
    data.milestones.push(...newMilestones);

    const newTasks = Array.isArray(args.tasks) ? args.tasks.filter(t => t && t.name).map((t, i) => ({
      id: `t-${now}-${i}`,
      projectId: project.id,
      milestoneId: '',
      workstream: t.workstream || '通用',
      name: t.name,
      nextAction: t.next_action || `完成${t.name}`,
      priority: t.priority || '中',
      duration: t.duration || '45分钟',
      deadline: new Date().toISOString().slice(0, 10),
      status: 'todo',
      today: t.today !== false
    })) : [];
    data.tasks.push(...newTasks);

    dataStore.save(data);
    projects = data.projects;
    pendingProject = project.id;
    selectedProjectId = project.id;
    buildNav();
    return { project: project.name, created_if_missing: created, milestones_added: newMilestones.length, tasks_added: newTasks.length };
  }
});

// 9. log_health - 记录健康数据
defTool({
  name: 'log_health',
  description: '记录一项健康数据（睡眠、精力、饮食/饮水、健康记录、恢复）。',
  parameters: {
    type: 'object',
    properties: {
      type: { type: 'string', enum: ['sleep', 'energy', 'nutrition', 'water', 'medical', 'recovery'], description: '记录类型' },
      // sleep
      sleep_time: { type: 'string', description: '入睡时间 HH:MM（可选，如果用户只说睡了几小时则不用传）' },
      wake_time: { type: 'string', description: '醒来时间 HH:MM（可选，如果用户只说睡了几小时则不用传）' },
      hours: { type: 'number', description: '睡眠总时长（小时），如果用户说了"睡了X小时"则传此参数' },
      feel: { type: 'string', enum: ['很差', '较差', '一般', '较好', '很好'], description: '醒来感受' },
      // energy
      level: { type: 'number', description: '精力等级 1-5' },
      // nutrition
      meal: { type: 'string', enum: ['早餐', '午餐', '晚餐', '加餐'], description: '餐次' },
      food: { type: 'string', description: '吃了什么' },
      // water
      amount_ml: { type: 'number', description: '饮水量 ml' },
      // recovery
      activity_name: { type: 'string', description: '恢复活动名称，如"拉伸"、"散步"' },
      minutes: { type: 'number', description: '时长（分钟）' },
      // common
      note: { type: 'string', description: '备注' }
    },
    required: ['type']
  },
  requiresConfirmation: false,
  execute(args) {
    const now = new Date();
    const todayStr = '2026-09-11T' + String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    if (args.type === 'water' && args.amount_ml) {
      const rec = { id: Date.now().toString(), time: todayStr, amount: args.amount_ml, note: args.note || '' };
      healthData.water.push(rec); saveHealth();
      return { logged: `饮水 ${args.amount_ml}ml` };
    }
    if (args.type === 'energy' && args.level) {
      const rec = { id: Date.now().toString(), time: todayStr, level: args.level, mood: '', tags: args.note || '', scene: '', note: '' };
      healthData.energy.push(rec); saveHealth();
      return { logged: `精力 ${args.level}/5` };
    }
    if (args.type === 'sleep') {
      let mins;
      if (args.hours) {
        mins = Math.round(args.hours * 60);
      } else if (args.sleep_time && args.wake_time) {
        const s = new Date(`2026-09-11T${args.sleep_time}`);
        let w = new Date(`2026-09-11T${args.wake_time}`);
        if (w <= s) w = new Date(w.getTime() + 86400000);
        mins = Math.round((w - s) / 60000);
      }
      if (mins) {
        const h = Math.floor(mins/60), m = mins%60;
        const rec = { id: Date.now().toString(), type: '夜间睡眠', sleep: args.sleep_time ? `2026-09-11T${args.sleep_time}` : '', wake: args.wake_time ? `2026-09-11T${args.wake_time}` : '', minutes: mins, duration: `${h} 小时${m ? ' ' + m + ' 分钟' : ''}`, feel: args.feel || '一般', tags: '', note: args.note || '' };
        healthData.sleep.push(rec); saveHealth();
        return { logged: `睡眠 ${rec.duration}，感受${args.feel||'一般'}` };
      }
    }
    if (args.type === 'nutrition' && args.meal && args.food) {
      const rec = { id: Date.now().toString(), time: todayStr, meal: args.meal, food: args.food, amount: '', feel: '', note: args.note || '' };
      healthData.nutrition.push(rec); saveHealth();
      return { logged: `${args.meal}：${args.food}` };
    }
    if (args.type === 'recovery' && args.activity_name && args.minutes) {
      const rec = { id: Date.now().toString(), name: args.activity_name, start: todayStr, minutes: args.minutes, before: '', after: '', note: args.note || '' };
      healthData.recovery.push(rec); saveHealth();
      return { logged: `${args.activity_name} ${args.minutes} 分钟` };
    }
    return { error: '缺少必要参数，请补充详细信息（如睡眠需要入睡和醒来时间）' };
  }
});

      available_minutes: { type: 'number', description: '今日可用时间（分钟），不填默认180' }
    },
    required: []
  },
  requiresConfirmation: false,
  execute(args) {
    const data = dataStore.get();
    const minutes = args.available_minutes || 180;
    const pending = data.tasks.filter(t => t.status !== 'done')
      .sort((a, b) => (b.priority === '高' ? 3 : b.priority === '中' ? 2 : 1) - (a.priority === '高' ? 3 : a.priority === '中' ? 2 : 1));
    const selected = [];
    let remaining = minutes;
    for (const t of pending) {
      const dur = parseInt(t.duration) || 45;
      if (dur <= remaining) { selected.push({ name: t.name, duration: t.duration, priority: t.priority, project: (data.projects.find(p=>p.id===t.projectId)||{}).name }); remaining -= dur; }
      if (remaining <= 0) break;
    }
    return { available_minutes: minutes, scheduled: selected, remaining_minutes: remaining };
  }
});

  parameters: {
    type: 'object',
    properties: {
      changes: {
        type: 'array',
        items: {
          type: 'object',
          properties: {
            task_query: { type: 'string' },
            new_deadline: { type: 'string' },
            add_to_today: { type: 'boolean' }
          },
          required: ['task_query', 'new_deadline']
        },
        description: '要调整的任务列表'
      }
    },
    required: ['changes']
  },
  requiresConfirmation: true,
  sensitiveDescription: args => {
    return `批量调整 ${args.changes.length} 个任务的日期`;
  },
  execute(args) {
    const data = dataStore.get();
    const results = [];
    for (const c of args.changes) {
      const task = data.tasks.find(t => t.name.toLowerCase().includes(c.task_query.toLowerCase()));
      if (task) {
        task.deadline = c.new_deadline;
        if (c.add_to_today) task.today = true;

    }
    dataStore.save(data);
    return { adjusted: results };
  }
});

/* ========== LLM Calling Layer (via backend SSE) ========== */
// 发送一次对话到后端 /chat/stream，解析 SSE 事件，回调 onContent/onStatus/onDone/onError
async function callLLM(messages, options = {}) {
  const { onContent, onStatus, signal, internalData, extraTools, agentSystemPrompt, temperature, knowledgeId, knowledgeDocumentIds } = options;
  const body = { messages, internalData: internalData || '', extraTools: extraTools || [] };
  if (knowledgeId) body.knowledgeId = knowledgeId;
  if (Array.isArray(knowledgeDocumentIds)) body.knowledgeDocumentIds = knowledgeDocumentIds;
  if (agentSystemPrompt) body.agentSystemPrompt = agentSystemPrompt;
  if (temperature != null) body.temperature = temperature;

  const resp = await fetch(API_BASE + '/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal
  });

  if (!resp.ok) {
    let err = '后端请求失败';
    try { err = await resp.text(); } catch (e) {}
    throw new Error(`API 错误 (${resp.status}): ${err.slice(0, 300)}`);
  }
  if (!resp.body) throw new Error('浏览器不支持流式响应');

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let fullContent = '';
  let toolCalls = [];
  let knowledgeSources = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    // SSE 按空行分隔事件块，每个事件块含 "event: xxx\ndata: {...}\n"
    const parts = buffer.split('\n\n');
    buffer = parts.pop() || '';
    for (const part of parts) {
      const lines = part.split('\n');
      let eventName = 'message';
      let dataStr = '';
      for (const ln of lines) {
        if (ln.startsWith('event: ')) eventName = ln.slice(7).trim();
        else if (ln.startsWith('data: ')) dataStr += ln.slice(6);
      }
      if (!dataStr) continue;
      let data;
      try { data = JSON.parse(dataStr); } catch (e) { continue; }

      if (eventName === 'content') {
        fullContent += data.content || '';
        if (onContent) onContent(data.content);
      } else if (eventName === 'status') {
        if (onStatus) onStatus(data.status);
      } else if (eventName === 'knowledge') {
        knowledgeSources = data.sources;
      } else if (eventName === 'error') {
        throw new Error(data.error || '后端错误');
      } else if (eventName === 'done') {
        toolCalls = (data.toolCalls || []).filter(Boolean);
        return { content: data.content || fullContent, toolCalls, knowledgeSources };
      }
    }
  }
  return { content: fullContent, toolCalls, knowledgeSources };
}

function initAgentSystem(){
  try{careerOverride=JSON.parse(localStorage.getItem('lifeos_career_override')||'{}')||{}}catch(e){careerOverride={}}
  try{const savedSelection=JSON.parse(localStorage.getItem('lifeos_career_knowledge_selection')||'[]');careerKnowledgeSelection=Array.isArray(savedSelection)?savedSelection:[]}catch(e){careerKnowledgeSelection=[]}
  // 加载自定义 Agent，并补齐旧数据缺失的知识库 ID
  try{
    const saved=localStorage.getItem('lifeos_custom_agents');
    if(saved){
      customAgents=JSON.parse(saved);
      let migrated=false;
      customAgents=customAgents.map(a=>{
        if(a.knowledgeId)return a;
        migrated=true;
        return {...a,knowledgeId:`kb-${a.id}`};
      });
      if(migrated)localStorage.setItem('lifeos_custom_agents',JSON.stringify(customAgents));
    }
  }catch(e){}
  // 恢复上次激活的 Agent
  try{const saved=localStorage.getItem('lifeos_active_agent');if(saved&&getAgent(saved))activeAgentId=saved}catch(e){}
  updateAgentHead();
  renderAgentDropdown();
  // 绑定事件
  document.getElementById('agentSelector').onclick=e=>{e.stopPropagation();toggleAgentDropdown()};
  document.getElementById('agentList').addEventListener('click',e=>{
    const item=e.target.closest('.agent-item');
    if(item){switchAgent(item.dataset.agentId);toggleAgentDropdown(false)}
  });
  // 点击外部关闭下拉
  document.addEventListener('click',e=>{
    if(agentDropdownOpen&&!e.target.closest('.agent-dropdown')&&!e.target.closest('#agentSelector')){
      toggleAgentDropdown(false);
    }
  });
}

function deleteCustomAgent(id){

          <label>温度 (Temperature): <span class="temp-val" id="tempVal">${a.temperature}</span></label>
          <div class="temp-row">
            <input id="agentTempInput" type="range" min="0" max="1" step="0.1" value="${a.temperature}">
          </div>
          <div class="hint">值越低越精确稳定，值越高越有创意</div>
        </div>
        <div class="form-field">
          <label>主题色</label>
          <input id="agentColorInput" type="color" value="${a.color}" style="width:60px;height:36px;padding:2px;cursor:pointer">
        </div>
        <div class="form-field">
          <label>专属知识库</label>
          <div class="context"><b>${escapeHtml(a.name||'新 Agent')} 的知识库</b><small style="display:block;margin-top:3px">${escapeHtml(knowledgeId)}</small></div>
          <button class="btn small" id="agentManageKnowledgeBtn" type="button" style="margin-top:8px">管理知识库</button>
          <div class="hint">每个 Agent 使用独立知识库，对话时自动检索相关内容</div>
        </div>
      </div>
      <div class="agent-modal-foot">
        ${isEdit?'<button class="btn" id="agentDeleteBtn" type="button" style="color:#ef4444;margin-right:auto">删除</button>':''}
        <button class="btn" id="agentCancelBtn" type="button">取消</button>
        <button class="btn primary" id="agentSaveBtn" type="button">${isEdit?'保存修改':'创建 Agent'}</button>
      </div>
    </div>`;
  mask.classList.add('show');

  // 温度滑块实时显示
  const tempInput=mask.querySelector('#agentTempInput');
  const tempVal=mask.querySelector('#tempVal');
  tempInput.oninput=()=>{tempVal.textContent=tempInput.value};

  const close=()=>mask.classList.remove('show');
  let openKnowledgeAfterSave=false;
  mask.querySelector('#agentModalClose').onclick=close;
  mask.querySelector('#agentCancelBtn').onclick=close;
  mask.onclick=e=>{if(e.target===mask)close()};
  mask.querySelector('#agentManageKnowledgeBtn').onclick=()=>{
    if(isEdit){
      if(activeAgentId!==a.id)switchAgent(a.id);
      close();
      settingsView='agent-knowledge';
      agentTab='knowledge';
      openSettings();
      return;
    }
    openKnowledgeAfterSave=true;
    mask.querySelector('#agentSaveBtn').click();
  };

  // 保存
  mask.querySelector('#agentSaveBtn').onclick=()=>{
    const name=mask.querySelector('#agentNameInput').value.trim();
    if(!name){showToast('请输入 Agent 名称');return}
    const temperature=parseFloat(tempInput.value);
    const newAgent={
      id:a.id,
      name,
      emoji:mask.querySelector('#agentEmoji').value.trim()||'🤖',
      desc:mask.querySelector('#agentDescInput').value.trim(),
      systemPrompt:mask.querySelector('#agentPromptInput').value.trim(),
      welcome:mask.querySelector('#agentWelcomeInput').value.trim()||`你好！我是${name}。`,
      temperature:Number.isNaN(temperature)?0.7:temperature,
      color:mask.querySelector('#agentColorInput').value||'#6366f1',
      knowledgeId,
      suggestions:[]
    };
    if(isEdit){
      const idx=customAgents.findIndex(x=>x.id===a.id);
      if(idx>=0)customAgents[idx]=newAgent;
    }else{
      customAgents.push(newAgent);
    }
    try{localStorage.setItem('lifeos_custom_agents',JSON.stringify(customAgents))}catch(e){}
    renderAgentDropdown();
    if(!isEdit)switchAgent(newAgent.id);
    else if(activeAgentId===newAgent.id)updateAgentHead();
    close();
    showToast(isEdit?'Agent 已更新':'Agent 已创建');
    if(openKnowledgeAfterSave){
      settingsView='agent-knowledge';
      agentTab='knowledge';
      openSettings();
    }else{
      refreshAgentTeam();
    }
  };

  // 删除
  const delBtn=mask.querySelector('#agentDeleteBtn');
  if(delBtn)delBtn.onclick=()=>{
    if(deleteCustomAgent(a.id))close();
  };
}

/* ========== Pending Confirmations ========== */
let pendingConfirmations = []; // {id, tool, args, description}
function requestConfirmation(tool, args, toolCallId) {
  return new Promise(resolve => {
    const id = `confirm-${Date.now()}`;
    const desc = tool.sensitiveDescription ? tool.sensitiveDescription(args) : `执行操作：${tool.name}`;
    const bubble = addAIBubble(`<label>需要确认</label>即将执行以下操作，请确认：<div class="confirm-card"><b>${escapeHtml(desc)}</b><small>此操作会修改你的数据</small><div class="confirm-actions"><button class="btn small primary" data-confirm="${id}" type="button">确认执行</button><button class="btn small" data-cancel="${id}" type="button">取消</button></div></div>`);
    pendingConfirmations.push({ id, tool, args, toolCallId, resolve, bubble });
    messagesEl().scrollTop = messagesEl().scrollHeight;
  });
}
document.addEventListener('click', e => {
  const confirmBtn = e.target.closest('[data-confirm]');
  if (confirmBtn) {
    const id = confirmBtn.dataset.confirm;
    const pc = pendingConfirmations.find(p => p.id === id);
    if (pc) {
      pc.bubble.innerHTML = `<label>已确认</label>正在执行...`;
      try {
        const result = pc.tool.execute(pc.args);
        const toolResultMsg = { role: 'tool', tool_call_id: pc.toolCallId || `call_${id}`, content: JSON.stringify(result), name: pc.tool.name };
        chatHistory.push(toolResultMsg);
        pc.resolve({ action: 'confirmed', result, toolMsg: toolResultMsg });
      } catch (err) {
        pc.bubble.innerHTML = `<label>错误</label>执行失败：${escapeHtml(err.message)}`;
        pc.resolve({ action: 'error', error: err.message });
      }
      pendingConfirmations = pendingConfirmations.filter(p => p.id !== id);
    }
    return;
  }
  const cancelBtn = e.target.closest('[data-cancel]');
  if (cancelBtn) {
    const id = cancelBtn.dataset.cancel;
    const pc = pendingConfirmations.find(p => p.id === id);
    if (pc) {
      pc.bubble.innerHTML = `<label>已取消</label>操作未执行。`;
      pc.resolve({ action: 'cancelled' });
      pendingConfirmations = pendingConfirmations.filter(p => p.id !== id);
    }
    return;
  }
  const sugBtn = e.target.closest('[data-suggest]');
  if (sugBtn) {
    const input = document.getElementById('chatInput');
    input.value = sugBtn.dataset.suggest;
    document.getElementById('chatForm').dispatchEvent(new Event('submit'));
    return;
  }
}, true);

/* ========== Agent Loop (SSE streaming + tool dispatch) ========== */
const CAREER_TOOL_GROUPS={queryStatus:['query_status'],taskManagement:['create_task','complete_task','update_task','reschedule_task','delete_task','suggest_today','bulk_reschedule'],projectManagement:['create_project','update_project_detail'],healthRecords:['log_health'],memoryWrite:['add_memory'],pageNavigation:['navigate_to']};
function filterCareerTools(toolSchemas,agent){
  if(agent.id!=='career')return toolSchemas;
  const cfg={...CAREER_TOOL_DEFAULTS,...(agent.tools||{})},allowed=new Set();
  Object.entries(CAREER_TOOL_GROUPS).forEach(([group,names])=>{if(cfg[group])names.forEach(name=>allowed.add(name))});
  return toolSchemas.filter(t=>allowed.has(t.function.name));
}
// 取最近 max 条历史，同时去掉开头的孤儿 tool 消息（其对应的 assistant.tool_calls 已被截断）。
function safeChatWindow(history,max){
  const win=history.slice(-max);
  while(win.length && win[0].role==='tool') win.shift();
  return win;
}
async function runAgent(userMessage) {
  if (!aiConfig.isConfigured()) {
    const errHint = agentCfg && agentCfg.error ? `<small style="display:block;margin-top:6px;color:#b91c1c">后端服务未启动，请先运行 <code style="background:#fde8e8;padding:1px 5px;border-radius:4px">npm start</code>（端口 4174）</small>` : '';
    addAIBubble(`<label>需要配置</label>请先在<b>设置 → Agent 配置</b>中配置 API Key 后使用。<div style="margin-top:8px"><button class="btn small primary" data-page="settings" type="button">前往设置</button></div>${errHint}`, 'error');
    return;
  }

  chatHistory.push({ role: 'user', content: userMessage });

  // 本地工具转成 OpenAI function schema，作为 extraTools 传给后端
  const localToolSchemas = tools.map(t => ({
    type: 'function',
    function: { name: t.name, description: t.description, parameters: t.parameters }
  }));

  const MAX_ITERATIONS = 8;

  for (let i = 0; i < MAX_ITERATIONS; i++) {
    // 创建流式 AI 气泡
    const curAgent = getCurrentAgent();
    const aiBubble = addAIBubble(`<label>${escapeHtml(curAgent.emoji)} ${escapeHtml(curAgent.name)}</label><div class="ai-stream-content"></div><div class="ai-knowledge-sources" style="margin-top:6px"></div>`);
    const contentEl = aiBubble.querySelector('.ai-stream-content');
    const sourcesEl = aiBubble.querySelector('.ai-knowledge-sources');
    let statusTimer = null;
    const setStatus = txt => {
      contentEl.innerHTML = `<small style="color:var(--muted)">${escapeHtml(txt)}</small>`;
    };
    setStatus('思考中...');

    let resp;
    try {
      const hasCareerKnowledge=curAgent.id==='career'&&careerKnowledgeSelection.length>0;
      resp = await callLLM(safeChatWindow(chatHistory, 20), {
        internalData: buildInternalDataSnapshot(),
        extraTools: filterCareerTools(localToolSchemas,curAgent),
        agentSystemPrompt: curAgent.systemPrompt || '',
        temperature: curAgent.temperature != null ? curAgent.temperature : null,
        knowledgeId: curAgent.id==='career'?(hasCareerKnowledge?'kb-career':null):curAgent.knowledgeId,
        knowledgeDocumentIds: curAgent.id==='career'?(hasCareerKnowledge?careerKnowledgeSelection:[]):undefined,
        onContent: delta => {
          // 首次收到文本清除状态提示
          if (contentEl.querySelector('small')) contentEl.innerHTML = '';
          contentEl.textContent += delta;
          messagesEl().scrollTop = messagesEl().scrollHeight;
        },
        onStatus: s => {
          const label = s === 'searching_knowledge' ? '检索知识库中...' : s === 'generating' ? '生成中...' : s;
          if (contentEl.querySelector('small') || !contentEl.textContent) setStatus(label);
        }
      });
    } catch (err) {
      contentEl.innerHTML = '';
      aiBubble.innerHTML = `<label>错误</label>${escapeHtml(err.message)}<br><small>请检查后端服务是否启动、API Key 是否正确。</small>`;
      return;
    }

    // 知识库来源展示
    if (resp.knowledgeSources && resp.knowledgeSources.length) {
      sourcesEl.innerHTML = `<small style="color:var(--muted)">📚 参考：${resp.knowledgeSources.map(s => escapeHtml(s.source + (s.title ? ' - ' + s.title : ''))).join(' · ')}</small>`;
    } else {
      sourcesEl.remove();
    }

    const finalContent = (resp.content || '').trim();
    const toolCalls = resp.toolCalls || [];

    // 记录 assistant 消息到 history（含 tool_calls 以便多轮）
    const assistantMsg = { role: 'assistant', content: finalContent };
    if (toolCalls.length) assistantMsg.tool_calls = toolCalls.map(tc => ({ id: tc.id, type: 'function', function: tc.function }));
    chatHistory.push(assistantMsg);

    // 无工具调用 → 结束
    if (!toolCalls.length) {
      if (!finalContent) contentEl.innerHTML = '<small style="color:var(--muted)">（无回复内容）</small>';
      refreshAfterActions();
      return;
    }

    // 如果有 tool_calls 且没有文本内容，把气泡替换为"执行中"提示
    if (!finalContent) {
      contentEl.innerHTML = '<small style="color:var(--muted)">正在调用工具...</small>';
    }

    // 逐个处理 tool calls
    let cancelled = false;
    for (const tc of toolCalls) {
      const toolName = tc.function.name;
      let toolArgs = {};
      try { toolArgs = JSON.parse(tc.function.arguments || '{}'); } catch (e) { toolArgs = {}; }
      const tcId = tc.id || `call_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;

      const localTool = tools.find(t => t.name === toolName);

      if (localTool) {
        // 本地工具：在前端执行
        addToolNotice(`正在${toolDescriptionMap[toolName] || '执行操作'}...`);
        if (localTool.requiresConfirmation) {
          const pc = await requestConfirmation(localTool, toolArgs, tcId);
          if (pc.action === 'cancelled') {
            // 为当前及后续所有未处理的 tool call 补上 cancelled 结果，保持 assistant.tool_calls 配对完整
            for (const rem of toolCalls.slice(toolCalls.indexOf(tc))) {
              chatHistory.push({ role: 'tool', tool_call_id: rem.id || `call_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`, content: JSON.stringify({ cancelled: true }), name: rem.function.name });
            }
            cancelled = true;
            break;
          }
          if (pc.action === 'error') { return; }
          // requestConfirmation 内部已把 tool result push 进 chatHistory
          const resultPreview = formatToolResult(toolName, pc.result);
          if (resultPreview) addToolNotice(resultPreview);
        } else {
          try {
            const result = localTool.execute(toolArgs);
            chatHistory.push({ role: 'tool', tool_call_id: tcId, content: JSON.stringify(result), name: toolName });
            const resultPreview = formatToolResult(toolName, result);
            if (resultPreview) addToolNotice(resultPreview);
          } catch (err) {
            chatHistory.push({ role: 'tool', tool_call_id: tcId, content: JSON.stringify({ error: err.message }), name: toolName });
            addToolNotice(`操作失败：${err.message}`);
          }
        }
      } else {
        // 远端技能：POST 到后端 /chat/tool
        addToolNotice(`正在${toolDescriptionMap[toolName] || '调用技能 ' + toolName}...`);
        try {
          const r = await fetch(API_BASE + '/chat/tool', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: toolName, args: toolArgs })
          });
          const d = await r.json();
          if (d.error) throw new Error(d.error);
          chatHistory.push({ role: 'tool', tool_call_id: tcId, content: JSON.stringify(d.result), name: toolName });
          const preview = formatToolResult(toolName, d.result);
          if (preview) addToolNotice(preview);
        } catch (err) {
          chatHistory.push({ role: 'tool', tool_call_id: tcId, content: JSON.stringify({ error: err.message }), name: toolName });
          addToolNotice(`技能调用失败：${err.message}`);
        }
      }
    }

    if (cancelled) {
      refreshAfterActions();
      return;
    }
    refreshAfterActions();
  }

  addAIBubble(`<label>LifeOS AI</label>操作链较长，先回复你的主要问题。如有其他需要请继续告诉我。`);
}

const toolDescriptionMap = {
  query_status: '查询数据',
  create_task: '创建任务',
  complete_task: '更新任务状态',
  update_task: '更新任务',
  reschedule_task: '调整任务日期',
  delete_task: '删除任务',
  create_project: '创建项目',
  update_project_detail: '更新项目详情',
  log_health: '记录健康数据',
  add_memory: '添加记忆',
  navigate_to: '跳转页面',
  suggest_today: '生成今日建议',
  bulk_reschedule: '批量调整任务',
  // 后端内置技能
  web_search: '联网搜索',
  create_reminder: '创建提醒',
  create_todo: '添加待办',
  query_calendar: '查询日历'
};

function formatToolResult(name, result) {
  if (result.error) return `操作失败：${result.error}`;
  if (name === 'create_task') return `已创建任务「${result.created}」（${result.project}）`;
  if (name === 'create_project') return `已创建项目「${result.name}」`;
  if (name === 'update_project_detail') return `已更新项目「${result.project}」详情${result.created_if_missing?'（已自动创建项目）':''}，新增 ${result.milestones_added||0} 个里程碑、${result.tasks_added||0} 个任务`;
  if (name === 'complete_task') return `任务「${result.task}」→ ${result.new_status === 'done' ? '已完成' : '未完成'}`;
  if (name === 'log_health') return `已记录：${result.logged}`;
  if (name === 'add_memory') return `已添加记忆`;
  if (name === 'navigate_to') return result.navigated;
  return null;
}

// Refresh page after actions to show changes
let refreshTimer = null;
function refreshAfterActions() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    // Only refresh if we're on a page that shows changed data
    if (['today', 'tiktokAgent', 'calendar', 'simple', 'agent', 'career', 'learning', 'health', 'exercise', 'finance', 'network'].includes(current)) {
      render(current);
    }
  }, 400);
}

/* ========== Chat Interface ========== */
async function handleAIChat(message) {
  const value = message.trim();
  if (!value) { showToast('请先输入一条消息'); return; }
  addUserBubble(value);
  document.getElementById('chatInput').value = '';
  await runAgent(value);
}

function initAIPanel() {
  initAgentSystem();
  showWelcomeIfEmpty();
}

document.getElementById('chatForm').onsubmit=e=>{e.preventDefault();const input=document.getElementById('chatInput'),value=input.value.trim();if(!value){showToast('请先输入一条消息');return}handleAIChat(value);input.value=''};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('settingsOverlay').classList.contains('show')){closeSettings();render(prevBeforeSettings)}});
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
buildNav();document.querySelectorAll('[data-icon]').forEach(x=>x.innerHTML=icon(x.dataset.icon));document.getElementById('brandIcon').innerHTML=icon('spark');document.getElementById('aiIcon').innerHTML=icon('spark');document.getElementById('addIcon').innerHTML=icon('plus');document.getElementById('searchToggle').innerHTML=icon('search');document.getElementById('notificationsButton').innerHTML=icon('bell');document.getElementById('profileButton').innerHTML=icon('user');document.getElementById('collapseAI').innerHTML=icon('left');document.getElementById('reopenAI').innerHTML=icon('chat');document.getElementById('attachButton').innerHTML=icon('clip');document.getElementById('sendButton').innerHTML=icon('send');document.getElementById('mobileNav').innerHTML=icon('menu');render('today');
// 启动后从后端拉取一次整块状态：有数据则写回本地并刷新一次（本地仍为兜底）。

  const keys=['lifeos_full_data','lifeosNetwork','lifeosHealthRecords','lifeosFinance'];

    const d=await backendState(k);

  }

    sessionStorage.setItem('lifeos_hydrated','1');

})();
(async()=>{ await loadAgentCfg(); initAIPanel(); })();
