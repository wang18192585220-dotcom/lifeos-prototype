<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeOS</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">LifeOS</div>
        <nav class="nav">
          <a href="#/today" data-route="today">今日</a>
          <a href="#/calendar" data-route="calendar">日历</a>
          <a href="#/goals" data-route="goals">目标</a>
          <a href="#/projects" data-route="projects">项目</a>
          <a href="#/chat" data-route="chat">聊天</a>
          <a href="#/learning" data-route="learning">学习</a>
          <a href="#/memory" data-route="memory">记忆</a>
          <a href="#/settings" data-route="settings">设置</a>
        </nav>
        <div class="vault-box">
          <button id="select-vault" type="button">选择 Vault</button>
          <p id="vault-path" class="vault-path">未选择</p>
        </div>
      </aside>
      <div class="main">
        <header class="topbar">
          <h1 id="page-title">今日</h1>
          <span id="status" class="status disconnected">未连接</span>
        </header>
        <main id="view" class="content"></main>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
